; PHP 5.6 legacy environment. Temporary - see docker/php56/Dockerfile.

display_errors = On
display_startup_errors = On
; E_ALL without E_DEPRECATED, because ext-mysql emits a deprecation notice on
; every single call and would otherwise bury every real warning. The legacy
; pages set their own error_reporting anyway.
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
memory_limit = 512M
max_execution_time = 120

; Connection details come from the environment via Includes/connect.php
; (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS), so the unix-socket overrides
; that used to live here are gone.
;
; This file is loaded by both SAPIs. The CLI test container inherits the
; variables from Docker directly; the fpm container needs the env[] lines in
; php-fpm.d/zz-app.conf, because php-fpm clears the environment by default.

; magic_quotes_gpc was removed in PHP 5.4, so it is already off here. Worth
; knowing, because Includes/slashes.php exists to compensate for it and the
; add()/strip() pairs behave differently than they did in 2005.

date.timezone = Europe/Amsterdam
upload_max_filesize = 16M
post_max_size = 16M
session.cookie_httponly = 1
