; PHP 5.6 legacy environment. Temporary - see docker/php56/Dockerfile.

display_errors = On
display_startup_errors = On
; E_ALL without E_DEPRECATED, because ext-mysql emits a deprecation notice on
; every single call and would otherwise bury every real warning. The legacy
; pages set their own error_reporting anyway.
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = On
memory_limit = 512M
max_execution_time = 120

; --- The socket trick ------------------------------------------------------
; tests/TestCase.php hardcodes host=localhost, and PHP treats "localhost" as a
; unix socket connection rather than TCP. The compose file shares the MySQL
; socket between containers through a named volume, so localhost resolves
; correctly and the suite runs with ZERO changes to the repo.
;
; If this misbehaves, fall back to the four-line DB_HOST change in
; docker/README.md - you need it for the PHP 8.4 stack regardless.
mysql.default_socket = /var/run/mysqld/mysqld.sock
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock

; magic_quotes_gpc was removed in PHP 5.4, so it is already off here. Worth
; knowing, because Includes/slashes.php exists to compensate for it and the
; add()/strip() pairs behave differently than they did in 2005.

date.timezone = Europe/Amsterdam
upload_max_filesize = 16M
post_max_size = 16M
session.cookie_httponly = 1
