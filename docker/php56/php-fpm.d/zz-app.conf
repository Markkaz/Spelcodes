[www]
access.log = /proc/self/fd/2
catch_workers_output = yes
php_admin_flag[log_errors] = on

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

security.limit_extensions = .php

; php-fpm clears the environment by default, so getenv() inside a page would
; return false and Includes/connect.php would silently fall back to localhost.
; Forwarding the variables explicitly is preferred over clear_env = no, which
; would expose the entire environment to PHP.
env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASS] = $DB_PASS
