; Shared php-fpm pool settings for every target.
[www]
; Healthcheck endpoint used by the Dockerfile HEALTHCHECK.
ping.path = /ping
ping.response = pong

; Logs go to the container's stdout/stderr, never to a file inside the image.
; This is what replaces the 10.8 MB error_log that used to live in the repo.
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on

; Sensible defaults for a small site; tune pm.max_children against the memory
; limit in app-prod.ini before you take real traffic.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Only ever execute the front controller and real .php files under the root.
security.limit_extensions = .php

; php-fpm clears the environment by default, so getenv() inside a page would
; return false and Includes/connect.php would silently fall back to localhost.
; Forwarding the variables explicitly is preferred over clear_env = no, which
; would expose the entire environment to PHP.
env[DB_HOST] = $DB_HOST
env[DB_PORT] = $DB_PORT
env[DB_NAME] = $DB_NAME
env[DB_USER] = $DB_USER
env[DB_PASS] = $DB_PASS
