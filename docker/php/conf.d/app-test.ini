; Test: errors surfaced to the runner, coverage available on demand.
display_errors = On
error_reporting = E_ALL
memory_limit = 512M
max_execution_time = 0

opcache.enable = 1
opcache.validate_timestamps = 1

; pcov stays off until --coverage is requested, so ordinary runs are fast.
pcov.enabled = 0
pcov.directory = /var/www/html

date.timezone = Europe/Amsterdam
