; Production: nothing rendered to the browser, everything logged.
; This setting alone closes the mysql_error() disclosure in the legacy pages.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
memory_limit = 128M
max_execution_time = 30

expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16

; Sessions are the authentication boundary once Step 4 lands - lock them down.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1

upload_max_filesize = 8M
post_max_size = 8M
date.timezone = Europe/Amsterdam
